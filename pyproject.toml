[project]
name = "visual-agent"
version = "0.1.0"
description = "Local-first workflow automation runtime for AI assistants with MCP, audit trails, and safety profiles."
requires-python = ">=3.10"
authors = [
    { name = "Checkpoint contributors" },
]
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "portalocker>=2.7",
    "pyautogui>=0.9.54",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
web = [
    "playwright>=1.44.0",
]
desktop = [
    "screen-ocr[winrt]>=0.3.0; platform_system == 'Windows'",
    "uiautomation>=2.0.20",
]
test = [
    "pytest>=8.0.0",
]
mcp = [
    "mcp>=1.0.0",
]
cloud = [
    "boto3>=1.34.0",
    "celery>=5.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
]

[project.scripts]
visual-agent = "visual_agent.cli:main"
visual-agent-mcp = "visual_agent.mcp_server:main"

[project.entry-points."pytest11"]
visual_agent = "visual_agent.pytest_plugin"

[project.urls]
Homepage = "https://github.com/Xiaoyu155/visual-agent"
Repository = "https://github.com/Xiaoyu155/visual-agent"
Issues = "https://github.com/Xiaoyu155/visual-agent/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".pytest_cache_local"
markers = [
    "e2e: end-to-end tests that run real CLI/workflows",
    "browser: tests that require Playwright Chromium",
    "slow: tests using OCR/VLM or other slow visual integrations",
]
