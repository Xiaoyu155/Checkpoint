schema_version: 1
name: desktop_ocr_real_acceptance_probe
version: 1
tags:
  - verification
  - desktop
  - ocr
  - real-acceptance
description: Live desktop OCR acceptance skeleton. Put the target application in front before running supervised.
steps:
  - id: observe_before
    action: observe_ocr
    engine_from: input.engine

  - id: assert_start_contract
    action: assert_text_contract
    required_all_from: input.required_before
    observation: observe_before
    forbidden_any_from: input.forbidden_before

  - id: type_amount
    action: type
    target: REPLACE_WITH_VISIBLE_INPUT_TEXT
    value_from: input.amount_value
    allow_desktop_input: true
    post_action_observe:
      engine_from: input.engine
      wait_seconds_from: input.wait_seconds
      assert_text_from: input.expected_amount_text

  - id: click_approve
    action: click_text
    text_from: input.approve_text
    engine_from: input.engine
    post_action_observe:
      engine_from: input.engine
      wait_seconds_from: input.wait_seconds
      assert_text_from: input.expected_after_text

  - id: assert_result_visible
    action: assert_text_contract
    required_all_from: input.required_after
    forbidden_any_from: input.forbidden_after
    observation: click_approve.post_action_observe
