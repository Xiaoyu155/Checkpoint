services:
  - type: web
    name: visual-agent-cloud-api
    env: docker
    dockerfilePath: ./xiao/cloud_api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: VISUAL_AGENT_WORKSPACE_ROOT
        value: .agent-workspace
      - key: VISUAL_AGENT_CLOUD_API_KEY_SHA256
        sync: false
      - key: VISUAL_AGENT_CLOUD_API_KEY_SALT
        sync: false

  - type: worker
    name: visual-agent-cloud-worker
    env: docker
    dockerfilePath: ./xiao/cloud_api/Dockerfile
    dockerContext: .
    plan: starter
    startCommand: celery -A cloud_api.worker.celery_app worker --loglevel=info
    envVars:
      - key: VISUAL_AGENT_CELERY_BROKER_URL
        sync: false
      - key: VISUAL_AGENT_CELERY_RESULT_BACKEND
        sync: false
