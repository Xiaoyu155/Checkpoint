schema_version: 1
min_runtime_version: "0.1.0"
name: devpacer_queue_workbench_acceptance
version: 1
visibility: private
tags:
  - verification
affects:
  - src/visual_agent/chief_queue.py
  - src/visual_agent/chief_run.py
  - src/visual_agent/cli.py
  - src/visual_agent/command_verification.py
  - src/visual_agent/dashboard.py
  - src/visual_agent/workbench_app.py
  - src/visual_agent/mission_plan_import.py
  - src/visual_agent/verification_profiles.py
  - src/visual_agent/hourly_budget.py
  - src/visual_agent/programs.py
  - src/visual_agent/program_scheduler.py
  - src/visual_agent/reference_research.py
  - tests/test_chief_queue.py
  - tests/test_chief_run.py
  - tests/test_command_verification.py
  - tests/test_dashboard_workbench.py
  - tests/test_mission_plan_import.py
  - tests/test_verification_profiles.py
  - tests/test_hourly_budget.py
  - tests/test_programs.py
  - tests/test_program_scheduler.py
  - tests/test_reference_research.py
  - docs/use_on_any_project.md
  - docs/codex开发日志与结果.md
  - .agent-workspace/workflows/devpacer_queue_workbench_acceptance.yaml
description: Lightweight coverage for DevPacer queue/workbench worker context, verification profile detection, mandatory records, and merge policy defaults. Behavior is covered by pytest; this workflow routes codex-check to the feature files.
steps:
  - id: assert_queue_module
    action: assert_file_exists
    path: ../src/visual_agent/chief_queue.py
    min_bytes: 1000
    extension: .py
  - id: assert_mission_runner
    action: assert_file_exists
    path: ../src/visual_agent/chief_run.py
    min_bytes: 1000
    extension: .py
  - id: assert_verification_profiles
    action: assert_file_exists
    path: ../src/visual_agent/verification_profiles.py
    min_bytes: 1000
    extension: .py
  - id: assert_programs
    action: assert_file_exists
    path: ../src/visual_agent/programs.py
    min_bytes: 1000
    extension: .py
  - id: assert_hourly_budget
    action: assert_file_exists
    path: ../src/visual_agent/hourly_budget.py
    min_bytes: 1000
    extension: .py
  - id: assert_dashboard
    action: assert_file_exists
    path: ../src/visual_agent/dashboard.py
    min_bytes: 1000
    extension: .py
  - id: assert_plan_import
    action: assert_file_exists
    path: ../src/visual_agent/mission_plan_import.py
    min_bytes: 1000
    extension: .py
  - id: assert_queue_tests
    action: assert_file_exists
    path: ../tests/test_chief_queue.py
    min_bytes: 500
    extension: .py
  - id: assert_profile_tests
    action: assert_file_exists
    path: ../tests/test_verification_profiles.py
    min_bytes: 500
    extension: .py
  - id: assert_program_tests
    action: assert_file_exists
    path: ../tests/test_programs.py
    min_bytes: 500
    extension: .py
  - id: assert_user_docs
    action: assert_file_exists
    path: ../docs/use_on_any_project.md
    min_bytes: 500
    extension: .md
