schema_version: 1
min_runtime_version: "0.1.0"
name: mission_import_acceptance
version: 1
visibility: private
author: ""
license: ""
tags:
  - verification
affects:
  - src/visual_agent/mission_plan_import.py
  - src/visual_agent/cli.py
  - src/visual_agent/git_diff.py
  - tests/test_mission_plan_import.py
  - tests/test_git_diff.py
  - docs/coding_agents.md
  - docs/final_vision_roadmap_2026-07.md
  - docs/product_rename_and_autonomous_dev_plan.md
  - .gitignore
  - .agent-workspace/workflows/mission_import_acceptance.yaml
description: Lightweight acceptance coverage for the DevPacer mission import facade. CLI behavior is covered by pytest; this workflow keeps codex-check routed to the feature artifacts.
steps:
  - id: observe_import_scope
    action: observe_ocr
    mock_text: DevPacer mission import artifacts ready
  - id: assert_import_module
    action: assert_file_exists
    path: ../src/visual_agent/mission_plan_import.py
    min_bytes: 1000
    extension: .py
  - id: assert_cli_facade
    action: assert_file_exists
    path: ../src/visual_agent/cli.py
    min_bytes: 1000
    extension: .py
  - id: assert_git_diff_routing
    action: assert_file_exists
    path: ../src/visual_agent/git_diff.py
    min_bytes: 500
    extension: .py
  - id: assert_import_tests
    action: assert_file_exists
    path: ../tests/test_mission_plan_import.py
    min_bytes: 500
    extension: .py
  - id: assert_git_diff_tests
    action: assert_file_exists
    path: ../tests/test_git_diff.py
    min_bytes: 500
    extension: .py
  - id: assert_user_docs
    action: assert_file_exists
    path: ../docs/coding_agents.md
    min_bytes: 500
    extension: .md
