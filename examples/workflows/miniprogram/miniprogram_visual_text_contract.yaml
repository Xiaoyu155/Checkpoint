schema_version: 1
min_runtime_version: "0.1.0"
name: miniprogram_visual_text_contract
version: 1
tags:
  - miniprogram
  - visual-contract
steps:
  - id: read_simulator_text
    action: observe_ocr
    engine: auto
    language_from: input.ocr_language
    language_default: chi_sim+eng
    min_confidence: 0.2
    window:
      title_contains_any_from: input.window_title_candidates
      title_contains_any_default:
        - "微信开发者工具"
        - "alipay-miniprogram"
      max_depth: 6
      max_elements: 2000
      min_width: 300
      min_height: 400
      bring_to_front: true
    fallback_to_screen: true
    # Adjust this crop if your simulator is not in the left side of DevTools.
    simulator_crop:
      left_percent: 0.0
      top_percent: 0.0
      width_percent: 0.7
      height_percent: 1.0
  - id: assert_required_text
    action: assert_text
    text_from: input.required_text
