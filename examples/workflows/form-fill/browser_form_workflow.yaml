schema_version: 1
min_runtime_version: "0.1.0"
name: browser_form_workflow
version: 1
steps:
  - id: observe_browser
    action: observe_browser
    url: examples/web/login_demo.html
  - id: wait_page
    action: wait_for
    condition: text
    text: 客户管理系统
    timeout_seconds: 1
  - id: fill_username
    action: paste
    target:
      label: 请输入用户名
      role: input
      preferred: [dom, mock]
    value_from: input.username
  - id: fill_password
    action: paste
    target:
      label: 请输入密码
      role: input
      preferred: [dom, mock]
    value_from: input.password
    sensitive: true
  - id: click_login
    action: click
    target:
      text: 登录
      role: button
      preferred: [dom, mock]
