<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout Demo</title>
</head>
<body>
  <h1>Checkout Demo</h1>

  <section id="product">
    <h2>Premium Widget</h2>
    <p>Price: $29.99</p>
    <button id="add-to-cart" data-bounds="80,150,320,44">Add to Cart - Premium Widget - $29.99</button>
  </section>

  <section id="cart">
    <h3>Your Cart</h3>
    <p>Subtotal: $29.99</p>
    <button id="checkout-btn" data-bounds="80,260,260,44">Proceed to Checkout</button>
  </section>

  <section id="shipping">
    <h3>Shipping Information</h3>
    <p>Standard Delivery: 3-5 business days</p>
    <button id="place-order" data-bounds="80,380,320,44">Place Order - Standard Delivery</button>
  </section>

  <section id="confirmation" aria-live="polite" hidden>
    <h3>Order Confirmed</h3>
    <p>Order #CP-1001 is ready for fulfillment.</p>
  </section>

  <script>
    document.getElementById("place-order").addEventListener("click", function () {
      document.getElementById("confirmation").hidden = false;
    });
  </script>
</body>
</html>
