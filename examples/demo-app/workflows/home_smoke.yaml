schema_version: 1
min_runtime_version: "0.1.0"
name: demo_app_home_smoke
version: 1
description: Smoke test the demo app home tab.
tags: [verification, fast, demo_app]
visibility: private
author: visual-agent-team
license: ""
steps:
  - id: observe_home
    action: observe_browser
    url: http://localhost:4173
  - id: assert_ready
    action: assert_browser_ready
    min_text_length: 1
  - id: assert_brand
    action: assert_text
    text: Checkpoint demo app
  - id: assert_tabs
    action: assert_text
    text: Workflow coverage for login, list, and form flows

