[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-agent"
version = "0.1.2"
description = "Pacer -- a thin launcher for coding agents (Claude Code / Codex) plus the delivery checks they skip."
keywords = [
    "pacer",
    "ai-agents",
    "coding-agents",
    "claude-code",
    "codex",
    "acceptance-testing",
]
requires-python = ">=3.10"
authors = [
    { name = "Checkpoint contributors" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "portalocker>=2.7",
    "PyYAML>=6.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
otel = [
    "opentelemetry-api>=1.25.0,<2",
    "opentelemetry-sdk>=1.25.0,<2",
]

[project.scripts]
pacer = "visual_agent.cli:main"
checkpoint = "visual_agent.cli:main"
visual-agent = "visual_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Xiaoyu155/Checkpoint"
Repository = "https://github.com/Xiaoyu155/Checkpoint"
Issues = "https://github.com/Xiaoyu155/Checkpoint/issues"
Documentation = "https://github.com/Xiaoyu155/Checkpoint/blob/main/xiao/docs/quickstart.md"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["visual_agent*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
visual_agent = [
    "agent_profiles/*.yaml",
]



[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["src", "."]
cache_dir = ".pytest_cache_local"
