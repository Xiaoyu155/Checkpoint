schema_version: 1
min_runtime_version: "0.1.0"
name: minimal_form_fill_workflow
version: 1
visibility: private
author: ""
license: ""
steps:
  - id: observe_fixture
    action: observe_fixture
    path: examples/fixtures/login_page_observation.json
  - id: assert_login_page
    action: assert_text
    text: 客户管理系统
  - id: fill_username
    action: paste
    target:
      label: 请输入用户名
      role: input
      preferred:
        - dom
        - mock
    value: demo_user
  - id: fill_password
    action: paste
    target:
      label: 请输入密码
      role: input
      preferred:
        - dom
        - mock
    value: demo_password
  - id: click_login
    action: click
    target:
      text: 登录
      role: button
      preferred:
        - dom
        - mock
