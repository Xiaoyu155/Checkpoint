schema_version: 1
min_runtime_version: "0.1.0"
name: checkout_verification
version: 1
visibility: private
author: ""
license: ""
tags:
  - verification
steps:
  - id: observe_page
    action: observe_browser
    url: examples/web/checkout_verification_demo.html
  - id: assert_title
    action: assert_text
    text: "Checkout Demo"
  - id: assert_product
    action: assert_text
    text: "Premium Widget"
  - id: assert_price
    action: assert_text
    text: "$29.99"
  - id: assert_add_to_cart
    action: assert_text
    text: "Add to Cart"
  - id: assert_checkout_button
    action: assert_text
    text: "Proceed to Checkout"
  - id: assert_shipping
    action: assert_text
    text: "Standard Delivery"
  - id: place_order
    action: click
    post_action_assert_text: "Order Confirmed"
    target:
      text: "Place Order"
      role: button
      preferred: [dom, mock]
  - id: observe_order_result
    action: observe_browser
    reuse_page: true
  - id: assert_order_contract
    action: assert_text_contract
    required_all:
      - "Order Confirmed"
      - "Order #CP-1001"
    forbidden_any:
      - "Payment Failed"
      - "Order Failed"
      - "Checkout Error"
      - "Next Step"
  - id: assert_order_confirmed
    action: assert_text
    text: "Order Confirmed"
  - id: assert_no_error
    action: assert_no_error
