<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>订单下载系统</title>
  </head>
  <body>
    <main>
      <h1>订单下载系统</h1>
      <button id="export-orders" data-testid="export-orders">导出订单</button>
      <output id="status" aria-label="导出状态"></output>
    </main>
    <script>
      document.getElementById("export-orders").addEventListener("click", async () => {
        const response = await fetch("https://example.test/api/orders/export", { method: "POST" });
        document.getElementById("status").textContent = response.ok ? "导出成功" : "导出失败";
      });
    </script>
  </body>
</html>
