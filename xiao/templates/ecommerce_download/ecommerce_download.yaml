schema_version: 1
min_runtime_version: "0.1.0"
name: ecommerce_download
version: 1
steps:
  - id: observe_orders
    action: observe_html
    path: fixtures/ecommerce_orders.html
  - id: wait_orders
    action: wait_for
    condition: text
    text: 订单管理
    timeout_seconds: 1
  - id: fill_start_date
    action: paste
    target:
      label: 开始日期
      role: input
      preferred: [dom, mock]
    value_from: input.date.start
  - id: fill_end_date
    action: paste
    target:
      label: 结束日期
      role: input
      preferred: [dom, mock]
    value_from: input.date.end
  - id: click_search
    action: click
    target:
      text: 查询
      role: button
      preferred: [dom, mock]
  - id: wait_export
    action: wait_for
    condition: target
    target:
      text: 导出订单
      role: button
      preferred: [dom, mock]
    timeout_seconds: 1
  - id: click_export
    action: click
