schema_version: 1
min_runtime_version: "0.1.0"
name: empty_list
version: 1
description: Verify an empty list state renders a useful message.
tags: [verification, fast, states, empty, example]
category: states
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_empty_list
    action: observe_browser
    url: "http://localhost:3000/items?state=empty"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
  - id: verify_empty_state
    action: assert_text
    text: "No items"
