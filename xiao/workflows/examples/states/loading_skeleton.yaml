schema_version: 1
min_runtime_version: "0.1.0"
name: loading_skeleton
version: 1
description: Verify loading state appears before content finishes loading.
tags: [verification, fast, states, loading, example]
category: states
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_loading
    action: observe_browser
    url: "http://localhost:3000/items?state=loading"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
  - id: verify_loading
    action: assert_text
    text: "Loading"
