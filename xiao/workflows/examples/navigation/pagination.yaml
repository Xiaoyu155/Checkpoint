schema_version: 1
min_runtime_version: "0.1.0"
name: pagination
version: 1
description: Verify pagination advances to the next page.
tags: [verification, fast, navigation, list, example]
category: navigation
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_page_one
    action: observe_browser
    url: "http://localhost:3000/items"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: go_next
    action: click
    target: { text: "Next", role: button }
    browser_post_action_observe: true
  - id: verify_next_page
    action: assert_text
    text: "Page 2"
