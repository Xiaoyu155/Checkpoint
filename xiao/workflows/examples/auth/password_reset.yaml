schema_version: 1
min_runtime_version: "0.1.0"
name: password_reset
version: 1
description: Verify the password reset request flow.
tags: [verification, fast, auth, forms, example]
category: auth
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_reset
    action: observe_browser
    url: "http://localhost:3000/forgot-password"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: fill_email
    action: type
    target: { label: "Email", role: input }
    value: "demo@example.com"
  - id: send_reset
    action: click
    target: { text: "Send reset link", role: button }
    browser_post_action_observe: true
  - id: verify_confirmation
    action: assert_text
    text: "Check your email"
