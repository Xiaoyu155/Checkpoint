schema_version: 1
min_runtime_version: "0.1.0"
name: logout_flow
version: 1
description: Verify an authenticated user can log out.
tags: [verification, fast, auth, example]
category: auth
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_account
    action: observe_browser
    url: "http://localhost:3000/account"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: open_user_menu
    action: click
    target: { text: "Account", role: button }
    browser_post_action_observe: true
  - id: click_logout
    action: click
    target: { text: "Log out", role: button }
    browser_post_action_observe: true
  - id: verify_signed_out
    action: assert_text
    text: "Sign in"
