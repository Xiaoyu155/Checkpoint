schema_version: 1
min_runtime_version: "0.1.0"
name: data_table
version: 1
description: Verify admin data table renders rows and controls.
tags: [verification, fast, admin, table, example]
category: admin
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_table
    action: observe_browser
    url: "http://localhost:3000/admin/users"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: verify_table
    action: assert_text
    text: "Users"
  - id: verify_create_action
    action: assert_text
    text: "Create"
