schema_version: 1
min_runtime_version: "0.1.0"
name: dashboard_smoke
version: 1
description: Verify admin dashboard core metrics render.
tags: [verification, fast, admin, smoke, example]
category: admin
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_dashboard
    action: observe_browser
    url: "http://localhost:3000/admin"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: verify_dashboard
    action: assert_text
    text: "Dashboard"
