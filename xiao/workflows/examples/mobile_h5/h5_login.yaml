schema_version: 1
min_runtime_version: "0.1.0"
name: h5_login
version: 1
description: Verify mobile H5 login flow at 375x812.
tags: [verification, fast, mobile_h5, auth, example]
category: mobile_h5
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_mobile_login
    action: observe_browser
    url: "http://localhost:3000/login"
    viewport: { width: 375, height: 812 }
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: fill_email
    action: type
    target: { label: "Email", role: input }
    value: "demo@example.com"
  - id: fill_password
    action: type
    target: { label: "Password", role: input }
    value: "demo-password"
  - id: tap_login
    action: click
    target: { text: "Sign in", role: button }
    browser_post_action_observe: true
  - id: verify_mobile_dashboard
    action: assert_text
    text: "Dashboard"
