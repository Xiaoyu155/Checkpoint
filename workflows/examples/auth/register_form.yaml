schema_version: 1
min_runtime_version: "0.1.0"
name: register_form
version: 1
description: Verify account registration accepts required fields and shows success.
tags: [verification, fast, auth, forms, example]
category: auth
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_register
    action: observe_browser
    url: "http://localhost:3000/register"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: fill_name
    action: type
    target: { label: "Name", role: input }
    value: "Demo User"
  - id: fill_email
    action: type
    target: { label: "Email", role: input }
    value: "demo@example.com"
  - id: fill_password
    action: type
    target: { label: "Password", role: input }
    value: "demo-password"
  - id: submit_registration
    action: click
    target: { text: "Create account", role: button }
    browser_post_action_observe: true
  - id: verify_success
    action: assert_text
    text: "Account created"
