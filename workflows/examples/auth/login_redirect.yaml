schema_version: 1
min_runtime_version: "0.1.0"
name: login_redirect
version: 1
description: Verify a protected page redirects anonymous users to login.
tags: [verification, fast, auth, navigation, example]
category: auth
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_protected_page
    action: observe_browser
    url: "http://localhost:3000/dashboard"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
  - id: verify_login_prompt
    action: assert_text
    text: "Sign in"
  - id: verify_redirect_hint
    action: wait_for
    condition: url
    url_contains: "/login"
    timeout_seconds: 5
