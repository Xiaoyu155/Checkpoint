schema_version: 1
min_runtime_version: "0.1.0"
name: delete_confirm
version: 1
description: Verify admin delete confirmation flow.
tags: [verification, admin, crud, destructive, example]
category: admin
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_records
    action: observe_browser
    url: "http://localhost:3000/admin/users"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: click_delete
    action: click
    target: { text: "Delete", role: button }
    browser_post_action_observe: true
  - id: verify_confirm
    action: assert_text
    text: "Are you sure"
  - id: cancel_delete
    action: click
    target: { text: "Cancel", role: button }
    browser_post_action_observe: true
