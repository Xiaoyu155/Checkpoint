schema_version: 1
min_runtime_version: "0.1.0"
name: search_form
version: 1
description: Verify search input returns matching results.
tags: [verification, fast, forms, search, example]
category: forms
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_search
    action: observe_browser
    url: "http://localhost:3000/search"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: enter_query
    action: type
    target: { label: "Search", role: input }
    value: "demo"
  - id: submit_search
    action: press_key
    keys: "Enter"
    browser_post_action_observe: true
  - id: verify_results
    action: assert_text
    text: "Results"
