schema_version: 1
min_runtime_version: "0.1.0"
name: h5_home
version: 1
description: Verify mobile H5 home page at 375x812.
tags: [verification, fast, mobile_h5, navigation, example]
category: mobile_h5
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_mobile_home
    action: observe_browser
    url: "http://localhost:3000/"
    viewport: { width: 375, height: 812 }
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: verify_home
    action: assert_text
    text: "Home"
