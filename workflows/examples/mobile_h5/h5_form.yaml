schema_version: 1
min_runtime_version: "0.1.0"
name: h5_form
version: 1
description: Verify mobile H5 form submission at 375x812.
tags: [verification, fast, mobile_h5, forms, example]
category: mobile_h5
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_mobile_form
    action: observe_browser
    url: "http://localhost:3000/contact"
    viewport: { width: 375, height: 812 }
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: fill_message
    action: type
    target: { label: "Message", role: textbox }
    value: "Mobile demo message"
  - id: submit_form
    action: click
    target: { text: "Send", role: button }
    browser_post_action_observe: true
  - id: verify_sent
    action: assert_text
    text: "Message sent"
