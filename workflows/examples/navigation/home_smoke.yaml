schema_version: 1
min_runtime_version: "0.1.0"
name: home_smoke
version: 1
description: Verify the home page renders with primary navigation.
tags: [verification, fast, navigation, smoke, example]
category: navigation
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_home
    action: observe_browser
    url: "http://localhost:3000/"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: verify_home
    action: assert_text
    text: "Home"
