schema_version: 1
min_runtime_version: "0.1.0"
name: deep_link
version: 1
description: Verify a deep link opens the intended detail state directly.
tags: [verification, fast, navigation, detail, example]
category: navigation
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_deep_link
    action: observe_browser
    url: "http://localhost:3000/settings/profile"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: verify_profile_section
    action: assert_text
    text: "Profile"
