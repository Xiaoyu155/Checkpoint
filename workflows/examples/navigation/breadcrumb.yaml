schema_version: 1
min_runtime_version: "0.1.0"
name: breadcrumb
version: 1
description: Verify breadcrumb navigation returns to the parent page.
tags: [verification, fast, navigation, example]
category: navigation
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_detail
    action: observe_browser
    url: "http://localhost:3000/projects/demo"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: click_projects_breadcrumb
    action: click
    target: { text: "Projects", role: link }
    browser_post_action_observe: true
  - id: verify_projects_list
    action: assert_text
    text: "Projects"
