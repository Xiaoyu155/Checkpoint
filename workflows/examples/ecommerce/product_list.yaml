schema_version: 1
min_runtime_version: "0.1.0"
name: product_list
version: 1
description: Verify product listing page renders products.
tags: [verification, fast, ecommerce, list, example]
category: ecommerce
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_products
    action: observe_browser
    url: "http://localhost:3000/products"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: verify_products
    action: assert_text
    text: "Products"
