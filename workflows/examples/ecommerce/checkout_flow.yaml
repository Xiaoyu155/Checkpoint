schema_version: 1
min_runtime_version: "0.1.0"
name: checkout_flow
version: 1
description: Verify checkout accepts customer details and reaches review.
tags: [verification, ecommerce, checkout, example]
category: ecommerce
visibility: public
author: visual-agent-team
license: cc-by-4.0
steps:
  - id: observe_checkout
    action: observe_browser
    url: "http://localhost:3000/checkout"
  - id: browser_ready
    action: assert_browser_ready
    min_text_length: 1
    min_interactive: 1
  - id: fill_email
    action: type
    target: { label: "Email", role: input }
    value: "demo@example.com"
  - id: fill_address
    action: type
    target: { label: "Address", role: input }
    value: "100 Demo Street"
  - id: continue_to_review
    action: click
    target: { text: "Continue", role: button }
    browser_post_action_observe: true
  - id: verify_review
    action: assert_text
    text: "Review order"
